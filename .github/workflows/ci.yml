# CI — runs the checks Netlify's build does NOT: unit/parity tests, lint, typecheck.
# (Netlify already builds + deploy-previews every PR, so the production build is gated
# there; this workflow adds the test/quality gates on top.)
#
# Hard gates (all blocking):
#   `pnpm test`   — vitest sanitizer/markdown parity + unit suite (61 tests).
#   `pnpm lint`   — eslint jsx-a11y on .astro templates (0 findings).
#   `astro check` — TypeScript typecheck (0 errors; 26 advisory hints remain).
# (The 19 lint + 44 type findings present on 2026-06-01 were cleared, so lint + typecheck
#  are now blocking gates — see CHANGELOG 0.42.28.)
#
# Not here (deliberately): the SSR `build` (Netlify deploy-preview covers it, and it hits
# live Strapi ~140× so it'd be flaky in CI); Playwright E2E + axe/Lighthouse (need a
# running server / the deploy-preview URL — wire as a deploy-preview-triggered job next).

name: CI

on:
  pull_request:
  push:
    branches: [main, feat/astro-migration]

jobs:
  test:
    name: Tests (vitest — parity + unit render gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: astro/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  quality:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: astro/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # `astro check` statically resolves a build-generated JSON import (hub-images-manifest —
      # gitignored, created by the prebuild, which hits Strapi). The typecheck only needs the
      # module to RESOLVE (research.ts casts it + try/catches at runtime), so stub an empty
      # manifest when absent; the real one is generated at build time on Netlify.
      - name: Ensure hub-images manifest exists (typecheck only)
        run: test -f public/hub-images-manifest.json || echo '{}' > public/hub-images-manifest.json
      - run: pnpm exec astro check

  # ---------------------------------------------------------------------------
  # Vue 2 main app (repo root). Runs the mocha unit suite — the one thing
  # nothing else gates: Netlify only runs `npm run build`, and the jobs above
  # only cover astro/. Self-contained (no live server / no Strapi); search.spec
  # stubs fetch, AppInit reads committed src/config/*.json.
  #
  # NOTE: config.spec.js reads public/api/*.json, which is .gitignored
  # (build-generated from Strapi). It is excluded from the CI invocation below
  # so the gate stays hermetic; run the full `npm run tests` locally to include
  # the data-integrity checks.
  # ---------------------------------------------------------------------------
  vue-unit:
    name: Vue 2 unit tests (mocha — main app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Unit tests (excludes config.spec — needs build-generated public/api/*.json)
        run: >-
          NODE_OPTIONS=--openssl-legacy-provider
          npx vue-cli-service test:unit
          --require ./tests/unit/setup.js
          --timeout 10000
          "tests/unit/!(config).spec.js"
