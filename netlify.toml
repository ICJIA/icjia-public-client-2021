[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

  
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Access-Control-Allow-Origin = "https://icjia.illinois.gov"
    # Content-Security-Policy (SEC-09 — promoted to ENFORCEMENT in v1.3.40)
    #
    # Was Content-Security-Policy-Report-Only since v1.3.33; allowlist was
    # validated against actual page loads (Chrome MCP audit, 2026-04-12)
    # before flipping. All currently-loaded origins (Plausible, jsdelivr,
    # cdnjs, fonts.googleapis/gstatic, agency/researchhub APIs, thumbor
    # image.icjia.cloud via the broad img-src https:, Netlify status
    # badges) are covered by the existing directives.
    #
    # worker-src 'self' added for the new search Web Worker
    # (public/searchWorker.js + public/fuse.min.js).
    # upgrade-insecure-requests added so any accidental http:// asset
    # is auto-upgraded to https://, defending against mixed-content.
    #
    # If a future build needs a new third-party origin (e.g. embedding
    # vue-tweet-embed), add it to the appropriate directive BEFORE
    # deploying — enforced CSP will block unlisted origins outright.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://plausible.icjia.cloud https://assets.adobedtm.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https://agency.icjia-api.cloud https://agency.icjia.cloud https://researchhub.icjia-api.cloud https://plausible.icjia.cloud https://assets.adobedtm.com; worker-src 'self'; frame-src 'self' https://www.youtube.com https://player.vimeo.com https://public.tableau.com https://docs.google.com https://forms.office.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://agency.icjia-api.cloud; upgrade-insecure-requests"
    # Hide Express server framework disclosure (SEC-14)
    X-Powered-By = ""

# Long-cache hashed build assets — Vue CLI emits content-hashed filenames
# (e.g. app.7a3f.js, chunk-vendors.b2c1.css) so an immutable cache is safe:
# any change yields a new hash, busting the cache automatically. Repeat
# visitors avoid re-downloading the JS/CSS bundles on every navigation.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# searchIndex.json regenerates each build but is not hashed; cache for an
# hour with stale-while-revalidate so the CDN can serve it instantly while
# fetching a fresh copy in the background.
[[headers]]
  for = "/searchIndex.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Search worker + Fuse.js loaded by the worker. Both live at the root and
# aren't content-hashed, but they only change on a code release. Give them
# a short max-age + stale-while-revalidate so most users get the cached copy.
[[headers]]
  for = "/searchWorker.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/fuse.min.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# index.html must always be revalidated so users pick up new builds
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
