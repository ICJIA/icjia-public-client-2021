[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "16"
  NPM_FLAGS = "--legacy-peer-deps"

  
[[headers]]
  for = "/*"
  [headers.values]
   ## X-Frame-Options = "SAMEORIGIN"
   ## X-XSS-Protection = "1; mode=block"
  ##  Referrer-Policy = "no-referrer"
  ##  X-Content-Type-Options = "nosniff"
    Access-Control-Allow-Origin = "*"
