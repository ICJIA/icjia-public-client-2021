[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

  
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Access-Control-Allow-Origin = "https://icjia.illinois.gov"
    # Content-Security-Policy — REPORT-ONLY mode (SEC-09)
    #
    # Reverted from enforced → report-only in v1.3.41 out of caution: the
    # site has no CSP report endpoint yet, so a missed allowlist entry
    # would silently break a page in production with no telemetry.
    #
    # Audit history (Chrome MCP, 2026-04-12, dev server) confirmed every
    # origin loaded across 9 representative routes is already in the
    # allowlist — homepage, research hub listing + article, about,
    # biographies, grant funding, news listing, LAP form, status page.
    # Zero iframes were observed in current content. Origin set per page:
    #   - icjia.illinois.gov (canonical link, = 'self' in prod)
    #   - agency.icjia.cloud, agency.icjia-api.cloud (Strapi)
    #   - cdn.jsdelivr.net (MDI fonts), cdnjs.cloudflare.com (jQuery)
    #   - fonts.googleapis.com, fonts.gstatic.com (Google Fonts)
    #   - plausible.icjia.cloud (analytics)
    #
    # To promote to enforcement when you have monitoring in place:
    #   rename "Content-Security-Policy-Report-Only" → "Content-Security-Policy"
    # then deploy. No allowlist changes needed if the audit is still current.
    #
    # The two new directives below are also report-only:
    #   - worker-src 'self' makes search-worker support explicit
    #     (public/searchWorker.js + public/fuse.min.js, v1.3.37)
    #   - upgrade-insecure-requests would auto-upgrade any http:// asset
    #     to https:// if enforced (currently a no-op in report-only mode)
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://plausible.icjia.cloud https://assets.adobedtm.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https://agency.icjia-api.cloud https://agency.icjia.cloud https://researchhub.icjia-api.cloud https://plausible.icjia.cloud https://assets.adobedtm.com; worker-src 'self'; frame-src 'self' https://www.youtube.com https://player.vimeo.com https://public.tableau.com https://docs.google.com https://forms.office.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://agency.icjia-api.cloud; upgrade-insecure-requests"
    # Hide Express server framework disclosure (SEC-14)
    X-Powered-By = ""

# Long-cache hashed build assets — Vue CLI emits content-hashed filenames
# (e.g. app.7a3f.js, chunk-vendors.b2c1.css) so an immutable cache is safe:
# any change yields a new hash, busting the cache automatically. Repeat
# visitors avoid re-downloading the JS/CSS bundles on every navigation.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# searchIndex.json regenerates each build but is not hashed; cache for an
# hour with stale-while-revalidate so the CDN can serve it instantly while
# fetching a fresh copy in the background.
[[headers]]
  for = "/searchIndex.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Search worker + Fuse.js loaded by the worker. Both live at the root and
# aren't content-hashed, but they only change on a code release. Give them
# a short max-age + stale-while-revalidate so most users get the cached copy.
[[headers]]
  for = "/searchWorker.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/fuse.min.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# index.html must always be revalidated so users pick up new builds
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
