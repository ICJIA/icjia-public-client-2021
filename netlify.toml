  
[build]
  Command = "npm run build"
  functions = "lambda"
  Publish = "dist"

[[redirects]]
    from = "/api/*"
    to = "/.netlify/functions/:splat"
    status = 200

[[redirects]]
  from = '/*'
  to = '/index.html'
  status = 200

[[redirects]]
  from = '/adultredeploy/*'
  to = 'https://adultredeploy-dev.netlify.app/:splat'
  status = 200
  
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Access-Control-Allow-Origin = "*"