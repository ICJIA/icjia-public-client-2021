[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

  
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Access-Control-Allow-Origin = "https://icjia.illinois.gov"
    # Content-Security-Policy — REPORT-ONLY mode (SEC-09)
    #
    # Reverted from enforced → report-only in v1.3.41 out of caution: the
    # site has no CSP report endpoint yet, so a missed allowlist entry
    # would silently break a page in production with no telemetry.
    #
    # Audit history (Chrome MCP, 2026-04-12, dev server) confirmed every
    # origin loaded across 9 representative routes is already in the
    # allowlist — homepage, research hub listing + article, about,
    # biographies, grant funding, news listing, LAP form, status page.
    # Zero iframes were observed in current content. Origin set per page:
    #   - icjia.illinois.gov (canonical link, = 'self' in prod)
    #   - agency.icjia.cloud, agency.icjia-api.cloud (Strapi)
    #   - fonts.googleapis.com, fonts.gstatic.com (Google Fonts)
    #   - plausible.icjia.cloud (analytics)
    # MDI icon font is now self-hosted from /fonts/mdi/ — no CDN needed.
    #   - ari.icjia-api.cloud (Strapi for the PROXIED /adultredeploy sub-app):
    #     pages under icjia.illinois.gov/<app>/* (a Netlify 200! rewrite, lesson
    #     #27) inherit THIS CSP. The ARI sub-app uses client-side live-fetch
    #     islands that connect to its own Strapi, so it must be in connect-src
    #     below — else they report-only-violate now and BREAK when this policy is
    #     promoted to enforcing. Add other sub-apps' API origins as they adopt it.
    #   - mail.icjia.cloud (nodemailer relay): axios POST target of the Grant
    #     Status and LAP Request form SUBMITS. Missed by the 2026-04-12 audit
    #     because it only exercised page loads, never a submit. One origin
    #     entry covers all /internet/* mail routes on every page.
    #
    # To promote to enforcement when you have monitoring in place:
    #   rename "Content-Security-Policy-Report-Only" → "Content-Security-Policy"
    # then deploy. No allowlist changes needed if the audit is still current.
    #
    # Notes on the two directives added in v1.3.40:
    #   - worker-src 'self' makes search-worker support explicit
    #     (public/searchWorker.js + public/fuse.min.js, v1.3.37). Safe in
    #     report-only.
    #   - upgrade-insecure-requests was originally added but REMOVED in
    #     v1.3.45: per the CSP spec this directive is only meaningful in
    #     enforcement mode and the browser logs a console warning every
    #     time it sees it in a Report-Only header ("'upgrade-insecure-
    #     requests' is ignored when delivered in a report-only policy").
    #     Re-add it inside the enforcement block when promoting:
    #       …; form-action 'self' https://agency.icjia-api.cloud;
    #       upgrade-insecure-requests
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://plausible.icjia.cloud; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://agency.icjia-api.cloud https://agency.icjia.cloud https://researchhub.icjia-api.cloud https://ari.icjia-api.cloud https://mail.icjia.cloud https://plausible.icjia.cloud; worker-src 'self'; frame-src 'self' https://www.youtube.com https://player.vimeo.com https://public.tableau.com https://public.data.illinois.gov https://docs.google.com https://forms.office.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://agency.icjia-api.cloud"
    # Hide Express server framework disclosure (SEC-14)
    X-Powered-By = ""

# Long-cache hashed build assets — Vue CLI emits content-hashed filenames
# (e.g. app.7a3f.js, chunk-vendors.b2c1.css) so an immutable cache is safe:
# any change yields a new hash, busting the cache automatically. Repeat
# visitors avoid re-downloading the JS/CSS bundles on every navigation.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# searchIndex.json regenerates each build but is not hashed; cache for an
# hour with stale-while-revalidate so the CDN can serve it instantly while
# fetching a fresh copy in the background.
[[headers]]
  for = "/searchIndex.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Search worker + Fuse.js loaded by the worker. Both live at the root and
# aren't content-hashed, but they only change on a code release. Give them
# a short max-age + stale-while-revalidate so most users get the cached copy.
[[headers]]
  for = "/searchWorker.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/fuse.min.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# index.html must always be revalidated so users pick up new builds
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Homicide reporting downloads (linked from src/views/Homicide/Homicide.vue).
# Exact paths, NOT "/homicide/*" — a splat would also match the /homicide/
# SPA route itself and override index.html's must-revalidate. Filenames are
# dated per quarterly release, so a day of caching is safe; each release
# ships new filenames (update these blocks when replacing the files).
[[headers]]
  for = "/homicide/homicide-reporting-sept2026-A0.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/homicide/homicide-reporting-quarterly_totals_sept2026.xlsx"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/homicide/homicide-reporting-annual_totals_sept2026.xlsx"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/homicide/homicide-reporting-12_month_totals_sept2026.xlsx"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# ──────────────────────────────────────────────────────────────────────────
# Astro migration branch (feat/astro-migration)
#
# Builds the NEW Astro SSR app from the astro/ subfolder instead of the legacy
# Vue app at the repo root. Production (main) is unaffected — it still uses the
# root [build] block above. Gives a live Netlify branch-deploy preview of the
# migration while the current site stays live.
#
# base="astro": Netlify installs deps + runs the build there (auto-detecting
# pnpm from astro/pnpm-lock.yaml + the packageManager field). command/publish
# resolve relative to base, so publish="dist" → astro/dist. The @astrojs/netlify
# adapter emits the SSR function + _redirects automatically.
# ──────────────────────────────────────────────────────────────────────────
[context."feat/astro-migration"]
  base = "astro"
  command = "pnpm build"
  publish = "dist"
  # User functions (relative to base=astro). The @astrojs/netlify adapter emits
  # its SSR function internally to .netlify/v1/functions; this dir is for our own
  # functions (keep-warm.mjs — a scheduled ping that keeps the SSR lambda + edge
  # cache warm for the highest-entry routes). The two coexist.
  functions = "netlify/functions"

[context."feat/astro-migration".environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.33.4"
